name: Deploy (not configured)

# Intentionally fail closed: a green deployment job must correspond to
# a real deployment. This workflow does NOT touch any production services.
# Implement deployment only after setting an explicit target, GitHub
# environment approvals, image provenance and rollback strategy.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  deployment-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block unconfigured deployment
        run: |
          echo "::error::PandaHub deployment is not configured. No application was deployed. Configure a production target, environment protection, image publishing and rollback before enabling deployment."
          exit 1
