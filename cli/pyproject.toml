[project]
name = "panda-cli"
version = "0.1.0"
description = "Command-line tool for PandaHub"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.scripts]
panda = "panda.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["panda*"]