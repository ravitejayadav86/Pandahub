version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: pandahub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pandahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pandahub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pandahub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pandahub} -d ${POSTGRES_DB:-pandahub}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pandahub_net

  redis:
    image: redis:7-alpine
    container_name: pandahub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pandahub_net

  minio:
    image: minio/minio:latest
    container_name: pandahub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pandahub_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pandahub_minio_dev_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - pandahub_net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: pandahub_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pandahub}:${POSTGRES_PASSWORD:-pandahub_dev_password}@postgres:5432/${POSTGRES_DB:-pandahub}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      GIT_REPOS_ROOT: /data/repositories
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - git_storage:/data/repositories
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - pandahub_net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: pandahub_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pandahub}:${POSTGRES_PASSWORD:-pandahub_dev_password}@postgres:5432/${POSTGRES_DB:-pandahub}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      GIT_REPOS_ROOT: /data/repositories
    command: celery -A app.worker.celery_app worker --loglevel=info -Q git_ops,ai_ops,email --concurrency=2
    volumes:
      - ./backend:/app
      - git_storage:/data/repositories
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pandahub_net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: pandahub_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pandahub_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  git_storage:
  frontend_node_modules:
  frontend_next:

networks:
  pandahub_net:
    driver: bridge
