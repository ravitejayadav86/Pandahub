worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 500M;   # large git pushes / LFS uploads

    # ---- Hide nginx version from error pages / headers ----
    server_tokens off;

    # ---- Rate limiting zones (defense in depth, alongside app-layer limits) ----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=git_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ---- SSL session caching for performance ----
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ---- Strong TLS configuration ----
    # Only TLS 1.2 and 1.3 — drop obsolete TLS 1.0/1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Mozilla "Intermediate" cipher list — broad compatibility, strong security
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

    # ---- OCSP stapling (improves TLS handshake performance) ----
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    # =========================================================================
    # HTTP → HTTPS redirect (all plain HTTP is permanently redirected)
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Allow ACME HTTP-01 challenges for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS — main application server
    # =========================================================================
    server {
        listen 443 ssl;
        server_name _;

        # ---- TLS Certificate ----
        # For production: replace with Let's Encrypt paths or your cert provider.
        # For local dev: run infrastructure/nginx/certs/generate-dev-certs.sh first.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # =========================================================================
        # Security Headers — production-grade, defense-in-depth
        # =========================================================================

        # Enforce HTTPS for 2 years, include subdomains, opt into preload list
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Prevent clickjacking: deny all iframe embedding
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Disable legacy XSS filter (CSP is superior)
        add_header X-XSS-Protection "0" always;

        # Control referrer information leak
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy — restricts where resources can be loaded from
        # Adjust connect-src if you add external analytics/APM
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss: ws: https://api.osv.dev; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Disable browser features not needed by this app
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;

        # Hide that we run nginx
        add_header Server "PandaHub" always;

        # ---- Auth endpoints: tighter rate limit ----
        location ~ ^/api/v1/auth/(login|register|password-reset) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Git Smart HTTP protocol ----
        location ~ ^/git/ {
            limit_req zone=git_limit burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }

        # ---- WebSocket upgrade (realtime notifications) ----
        location /ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- REST API ----
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- FastAPI auto-generated docs ----
        location /docs {
            proxy_pass http://backend_upstream;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Everything else → Next.js frontend ----
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
